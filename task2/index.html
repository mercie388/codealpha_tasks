<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    </div>
    <div class="calculator">
       <div class="display">
           <div id="history"></div>
           <div id="result">0</div>
       </div>
       <div class="buttons">
           <button class="btn_clear" onclick="clearAll()">AC</button>
           <button class="btn_clear" onclick="deleteOne()">DEL</button>
           <button class="btn_operator" onclick="append('%')">%</button>
           <button class="btn_clear" onclick="append('/')">÷</button>

           <button class="btn" onclick="append('7')">7</button>
           <button class="btn" onclick="append('8')">8</button>
           <button class="btn" onclick="append('9')">9</button>
           <button class="btn_operator" onclick="append('*')">×</button>

           <button class="btn" onclick="append('4')">4</button>
           <button class="btn" onclick="append('5')">5</button>
           <button class="btn" onclick="append('6')">6</button>
           <button class="btn_operator" onclick="append('-')">-</button>

           <button class="btn" onclick="append('1')">1</button>
           <button class="btn" onclick="append('2')">2</button>
           <button class="btn" onclick="append('3')">3</button>
           <button class="btn_operator" onclick="append('+')">+</button>
           
           <button class="btn" onclick="append('0')">0</button>
           <button class="btn" onclick="append('.')">.</button>
           <button class="btn_equal" onclick="calculate()">=</button>
       </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
